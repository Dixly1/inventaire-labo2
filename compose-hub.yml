# compose-hub.yml — version Docker Hub (sans build)
# Utilise les images publiees sur Docker Hub au lieu de les construire.
# Sert pour le deploiement distant (Partie A — GitHub Codespaces).
services:
  postgres:
    image: dixlyma/inventaire-postgres:1.0
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL",
             "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: dixlyma/inventaire-api:1.0
    env_file: .env
    ports:
      - "${API_PORT:-5000}:5000"
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  app_net:
    driver: bridge

volumes:
  pgdata:
